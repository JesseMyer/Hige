<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HIGE.GG · Multi-Stream</title>
<meta name="description" content="Every HIGE channel, one grid. Wardogs convoys, Warhammer campaigns, Hero Siege ladder, Civ VII, EQ:Legends raids.">
<meta name="theme-color" content="#08090b">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://hige.gg/watch">
<meta property="og:title" content="HIGE.GG · Multi-Stream">
<meta property="og:description" content="Every HIGE channel, one grid. Pick your angles.">
<meta property="og:image" content="https://hige.gg/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/hige-seal.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Cinzel+Decorative:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--void:#08090b;--pitch:#0d0f12;--slab:#14171c;--slab2:#1b2027;--iron:#272d36;--steel:#49525f;
--ash:#8b8778;--bone:#ece5d5;--parch:#c9c2b0;--ember:#e0912b;--ember-lit:#ffb648;--blood:#b8232b;--blood-lit:#e64a3c;
--rule:rgba(236,229,213,.13)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--parch);font-family:'Share Tech Mono',ui-monospace,monospace;display:flex;flex-direction:column;min-height:100svh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bar{display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;flex:0 0 auto;background:rgba(8,9,11,.92);border-bottom:1px solid var(--rule);position:relative;z-index:5}
.bar .crest{width:30px;height:auto;filter:drop-shadow(0 0 8px rgba(224,145,43,.35))}
.bar .wm{font-family:'Cinzel Decorative',serif;font-size:18px;font-weight:900;color:var(--bone);letter-spacing:.18em}
.ctx{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ash);border-left:1px solid var(--rule);padding-left:14px}
@media(max-width:680px){.ctx{display:none}}
.right{margin-left:auto;display:flex;gap:8px}
.tb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--parch);background:var(--slab);border:1px solid var(--iron);padding:9px 13px;cursor:pointer;transition:.16s;font-family:inherit}
.tb:hover{color:var(--bone);border-color:var(--steel)}
.tb.on{color:#fff;background:var(--blood);border-color:rgba(230,74,60,.55)}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;flex:0 0 auto;border-bottom:1px solid var(--rule);background:var(--pitch)}
.lab{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ash);margin-right:2px}
.ch{font-size:12px;letter-spacing:.1em;color:var(--ash);background:var(--slab);border:1px solid var(--iron);padding:9px 13px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
.ch:hover{color:var(--bone);border-color:var(--steel)}
.ch.sel{color:var(--bone);border-color:var(--ember);box-shadow:inset 0 -2px 0 var(--ember)}
.ch .dot{width:6px;height:6px;border-radius:50%;background:var(--steel)}
.ch.sel .dot{background:var(--ember-lit);box-shadow:0 0 8px var(--ember-lit)}
.ch .tag{font-size:9px;letter-spacing:.16em;color:var(--blood-lit);text-transform:uppercase}
.spacer{flex:1 1 auto}
.stage{flex:1 1 auto;display:flex;min-height:0}
.grid{flex:1 1 auto;display:grid;gap:2px;padding:2px;min-height:0}
.cell{position:relative;background:#000;min-height:0;overflow:hidden}
.cell iframe{width:100%;height:100%;border:0;display:block}
.cell .cap{position:absolute;top:0;left:0;z-index:2;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--blood);padding:5px 10px;pointer-events:none}
.chat{width:330px;flex:0 0 auto;border-left:1px solid var(--rule);background:#0b0c0e;display:none}
.chat.on{display:block}
.chat iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:900px){.chat{display:none!important}}
.empty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;gap:14px}
.empty img{width:clamp(110px,18vw,168px);opacity:.9;filter:drop-shadow(0 0 26px rgba(224,145,43,.2))}
.empty h2{font-family:Cinzel,serif;font-size:clamp(20px,3.6vw,30px);font-weight:900;color:var(--bone);margin:0;letter-spacing:.04em}
.empty p{color:var(--ash);max-width:44ch;margin:0;font-size:13px;line-height:1.7;letter-spacing:.06em}
.foot{flex:0 0 auto;padding:10px 16px;border-top:1px solid var(--rule);background:var(--pitch);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.foot a{color:var(--ash)}
.foot a:hover{color:var(--bone)}
</style>
</head>
<body>

<div class="bar">
  <a href="index.html" style="display:flex;align-items:center;gap:10px">
    <img class="crest" src="img/hige-seal.webp" alt="HIGE" width="320" height="320">
    <span class="wm">HIGE</span>
  </a>
  <span class="ctx">Multi-Stream · NA Central</span>
  <div class="right">
    <button class="tb" id="chatBtn" type="button">Chat</button>
    <a class="tb" href="index.html">← Site</a>
  </div>
</div>

<div class="picker" id="picker">
  <span class="lab">Channels</span>
  <span class="spacer"></span>
  <button class="tb" id="allBtn" type="button">All</button>
  <button class="tb" id="noneBtn" type="button">None</button>
</div>

<div class="stage">
  <div class="grid" id="grid"></div>
  <div class="chat" id="chat"></div>
</div>

<div class="foot">
  <span>Streams open muted · unmute the one you want</span>
  <span>Picks saved on this device</span>
  <a href="index.html#endtimes">End Times 24.09</a>
  <a href="index.html">HIGE.GG</a>
</div>

<script>
(function(){
  var CHANNELS = [
    {id:'HIGEsoot',    name:'Soot',    tag:'Active'},
    {id:'KodyCQ',      name:'Kody',    tag:'Active'},
    {id:'HIGEJibbish', name:'Jibbish', tag:''},
    {id:'higetat',     name:'Tat',     tag:''},
    {id:'grimwolf36',  name:'Grim',    tag:''},
    {id:'HIGEQuijibo', name:'Quijibo', tag:''},
    {id:'higecapin',   name:'Capin',   tag:''}
  ];
  var KEY='hige.watch.v3';
  var parent = location.hostname || 'hige.gg';
  var picked=[], chatOn=false;

  try{
    var s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s&&Array.isArray(s.picked)) picked=s.picked.filter(function(id){return CHANNELS.some(function(c){return c.id===id;});});
    if(s&&typeof s.chat==='boolean') chatOn=s.chat;
  }catch(e){}
  if(!picked.length) picked=['HIGEsoot','KodyCQ'];
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify({picked:picked,chat:chatOn})); }catch(e){} }

  var picker=document.getElementById('picker'), grid=document.getElementById('grid'),
      chat=document.getElementById('chat'), chatBtn=document.getElementById('chatBtn'),
      spacer=picker.querySelector('.spacer');

  CHANNELS.forEach(function(c){
    var b=document.createElement('button');
    b.type='button'; b.className='ch'; b.dataset.id=c.id;
    b.innerHTML='<span class="dot"></span>'+c.name+(c.tag?' <span class="tag">'+c.tag+'</span>':'');
    b.addEventListener('click',function(){
      var i=picked.indexOf(c.id);
      if(i>-1) picked.splice(i,1); else picked.push(c.id);
      save(); render();
    });
    picker.insertBefore(b,spacer);
  });
  document.getElementById('allBtn').addEventListener('click',function(){ picked=CHANNELS.map(function(c){return c.id;}); save(); render(); });
  document.getElementById('noneBtn').addEventListener('click',function(){ picked=[]; save(); render(); });
  chatBtn.addEventListener('click',function(){ chatOn=!chatOn; save(); render(); });

  function layout(n){
    if(n<=1) return [1,1];
    if(n===2) return [2,1];
    if(n<=4) return [2,2];
    if(n<=6) return [3,2];
    if(n<=9) return [3,3];
    return [4,Math.ceil(n/4)];
  }

  function render(){
    picker.querySelectorAll('.ch').forEach(function(b){ b.classList.toggle('sel', picked.indexOf(b.dataset.id)>-1); });
    chatBtn.classList.toggle('on', chatOn);

    chat.classList.toggle('on', chatOn && picked.length>0);
    if(chatOn && picked[0]){
      var want='https://www.twitch.tv/embed/'+picked[0]+'/chat?parent='+parent+'&darkpopout';
      var f=chat.querySelector('iframe');
      if(!f){ f=document.createElement('iframe'); chat.appendChild(f); }
      if(f.getAttribute('src')!==want) f.setAttribute('src',want);
    } else { chat.innerHTML=''; }

    if(!picked.length){
      grid.style.gridTemplateColumns='1fr'; grid.style.gridTemplateRows='1fr';
      grid.innerHTML='<div class="empty"><img src="img/hige-logo.webp" alt="HIGE.GG"><h2>Pick Your Angles</h2>'+
        '<p>Any combination of channels above. Two gets you side by side, six gets you a 3&times;2. Everything starts muted.</p></div>';
      return;
    }

    var d=layout(picked.length);
    grid.style.gridTemplateColumns='repeat('+d[0]+',1fr)';
    grid.style.gridTemplateRows='repeat('+d[1]+',1fr)';

    var have={};
    Array.prototype.slice.call(grid.children).forEach(function(el){ if(el.dataset&&el.dataset.id) have[el.dataset.id]=el; });
    grid.innerHTML='';
    picked.forEach(function(id){
      var cell=have[id];
      if(!cell){
        var meta=CHANNELS.filter(function(c){return c.id===id;})[0]||{name:id};
        cell=document.createElement('div'); cell.className='cell'; cell.dataset.id=id;
        var cap=document.createElement('span'); cap.className='cap'; cap.textContent=meta.name;
        var f=document.createElement('iframe');
        f.setAttribute('allowfullscreen',''); f.setAttribute('title',meta.name+' on Twitch');
        f.src='https://player.twitch.tv/?channel='+id+'&parent='+parent+'&muted=true&autoplay=true';
        cell.appendChild(cap); cell.appendChild(f);
      }
      grid.appendChild(cell);
    });
  }

  try{ render(); }
  catch(err){
    grid.innerHTML='<div class="empty"><h2>Stream grid hiccup</h2><p>Watch direct on '+
      '<a href="https://twitch.tv/HIGEsoot" style="color:#e64a3c">HIGEsoot</a> or '+
      '<a href="https://twitch.tv/KodyCQ" style="color:#e64a3c">KodyCQ</a>.</p></div>';
  }
})();
</script>
</body>
</html>
